name: 每週備份 D1

# 每週備份 Cloudflare D1（mwform）：完整 SQL dump + 每張表 JSON，存成 Artifact（保留 90 天）。
# D1 本身另有 30 天時間點還原（wrangler d1 time-travel），這份是額外的離線副本。
# 2026-11 前這個 workflow 是 Supabase 每日備份＋保活；D1 不會閒置暫停，所以不再需要保活。
#
# 需要的 GitHub Secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  Cloudflare API Token，權限：Account → D1:Edit（d1 execute 讀資料也需要 Edit）
on:
  schedule:
    - cron: '0 20 * * 0' # 每週日 UTC 20:00（台灣週一 04:00）
  workflow_dispatch: {} # 也可在 GitHub 手動觸發

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 86e28a4ac02bab6c0599d99f50afb5f1

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 備份只需要 wrangler，不裝整包依賴
      - run: npm install wrangler@4 --no-save --no-audit --no-fund

      - name: 備份 D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_ROOT: ./backup-out
        run: node scripts/backup-db.mjs

      - name: 上傳備份 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwform-d1-backup-${{ github.run_number }}
          path: backup-out/
          retention-days: 90
